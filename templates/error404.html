{% comment %}404 页面：访问不存在的用户/站点/文章时返回{% endcomment %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - 页面不存在</title>
    <link rel="stylesheet" href="/static/bootstrap-3.4.1-dist/css/bootstrap.min.css">
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; }
        .box-404 { text-align: center; margin-top: 120px; }
        .box-404 h1 { font-size: 96px; color: #d9534f; margin: 0; }
        .box-404 p { font-size: 18px; color: #777; margin: 10px 0 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="box-404">
        <h1>404</h1>
        <p>抱歉，您访问的页面或用户站点不存在。</p>
        <a href="/" class="btn btn-primary">返回首页</a>
    </div>
</div>
</body>
</html>
