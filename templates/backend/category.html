{% extends 'backend/base.html' %}
{% comment %}分类管理：列表 + 新增（输入框） + 编辑（prompt） + 删除（confirm）全部 AJAX{% endcomment %}

{% block content %}
<div class="panel panel-default">
    <div class="panel-heading"><strong>分类管理</strong></div>
    <div class="panel-body" style="padding:24px;">
        <div class="form-inline" style="margin-bottom:18px;">
            <input type="text" id="catName" class="form-control" placeholder="新分类名" style="min-width:200px;">
            <button class="btn btn-primary" id="addBtn" style="border-radius:6px;">新增</button>
        </div>

        <table class="table table-striped" style="margin-bottom:0;">
            <thead><tr><th>ID</th><th>分类名</th><th>操作</th></tr></thead>
            <tbody>
            {% for c in categories %}
                <tr>
                    <td>{{ c.id }}</td>
                    <td class="cat-name">{{ c.name }}</td>
                    <td>
                        <button class="btn btn-default btn-xs editBtn"
                                data-id="{{ c.id }}" data-name="{{ c.name }}">编辑</button>
                        <button class="btn btn-danger btn-xs delBtn" data-id="{{ c.id }}">删除</button>
                    </td>
                </tr>
            {% empty %}
                <tr><td colspan="3" class="text-center text-muted">暂无分类</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block js %}
{{ block.super }}
<script>

    $('#addBtn').click(function () {
        let name = $('#catName').val().trim();
        if (!name) { alert('分类名不能为空'); return; }
        $.post('/backend/category/', {action: 'add', name: name}, function (res) {
            if (res.code === 200) { alert(res.msg); location.reload(); }
            else { alert(res.msg); }
        });
    });
    $('.editBtn').click(function () {
        let id = $(this).data('id');
        let old = $(this).data('name');
        let name = prompt('修改分类名：', old);
        if (name === null) return;
        name = name.trim();
        if (!name) { alert('分类名不能为空'); return; }
        $.post('/backend/category/', {action: 'edit', id: id, name: name}, function (res) {
            if (res.code === 200) { alert(res.msg); location.reload(); }
            else { alert(res.msg); }
        });
    });
    $('.delBtn').click(function () {
        if (!confirm('确认删除该分类？')) return;
        let id = $(this).data('id');
        $.post('/backend/category/', {action: 'del', id: id}, function (res) {
            if (res.code === 200) { alert(res.msg); location.reload(); }
            else { alert(res.msg); }
        });
    });
</script>
{% endblock %}
